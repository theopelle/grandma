# Push a tag like v1.0.0 to publish a release with grandma.zip attached.
# Bump "version" in .claude-plugin/plugin.json to match, so plugin users get the update.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build grandma.zip
        run: cd skills && zip -r ../grandma.zip grandma -x '*.DS_Store'

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" grandma.zip --title "Grandma $GITHUB_REF_NAME" --generate-notes
